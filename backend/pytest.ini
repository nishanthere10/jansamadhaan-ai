[pytest]
# ── Discovery ─────────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ────────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
    --ignore=tests/outputs
    --ignore=tests/legacy_scripts

# ── Custom markers ────────────────────────────────────────────────────────────
markers =
    live: marks tests that make real network calls (deselect with -m "not live")
    slow: marks tests expected to take > 1s

# ── Environment ───────────────────────────────────────────────────────────────
# Ensure the app package is importable
pythonpath = .
